[workspace]
resolver = "2"
members = [
    "crates/sem-traits",
    "crates/sem-dsl",
    "crates/sem-autodiff",
    "crates/sem-pls",
    "crates/sem-cb",
    "crates/sem-py",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
faer = "0.20"
rayon = "1.10"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
