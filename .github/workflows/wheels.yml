name: Build Wheels

permissions:
  contents: write
  id-token: write

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.ver.outputs.should_release }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Cargo.toml version & auto-tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: macos-15-intel
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip -o dist --manifest-path semflow/crates/sem-py/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip -o dist --manifest-path semflow-dl/crates/semflow-dl-py/Cargo.toml
      - name: Verify wheel size (< 5 MiB)
        shell: python
        run: |
          import glob, os, sys
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) >= 2, f"Expected >=2 wheels, got {wheels}"
          for w in wheels:
              sz = os.path.getsize(w)
              print(f"{os.path.basename(w)}: {sz} bytes")
              if sz >= 5242880:
                  sys.exit(f"ERROR: {w} is {sz} bytes (>= 5 MiB)")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: [check-release, build-wheels]
    if: ${{ !cancelled() && needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          generate_release_notes: true
          files: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-dl:
    needs: [check-release, build-wheels]
    if: ${{ !cancelled() && needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi-sem-dl
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist_dl
          pattern: wheels-*
          merge-multiple: true
      - name: Keep only aetiocore_sem_dl wheels
        shell: bash
        run: |
          mkdir -p dist_dl_only
          mv dist_dl/aetiocore_sem_dl*.whl dist_dl_only/ 2>/dev/null || true
          ls -la dist_dl_only
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist_dl_only
          skip-existing: true
