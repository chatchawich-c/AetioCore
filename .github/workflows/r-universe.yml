name: Sync R-Universe Package
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
permissions:
  contents: write
jobs:
  publish-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: r-pkg-release
          publish_dir: bindings/r
          force_orphan: true
